name: Build AppImage (Linux x86_64, Qt6)

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Checkout branch'
        required: false
        default: dev
      tag:
        description: 'Checkout tag'
        required: false

permissions:
  contents: write

jobs:
  build-omodscan:
    name: Build OpenModScan AppImage version '${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}' with Qt6
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    env:
      QT_VERSION: "6.9.3"
      APPIMAGETOOL_VERSION: "continuous"
      APPIMAGE_EXTRACT_AND_RUN: "1"
      ARCH: x86_64

    outputs:
      package-file: ${{ steps.package.outputs.file }}
      artifact-name: ${{ steps.package.outputs.artifact }}
      desktop-file: ${{ steps.package.outputs.desktop-file }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}

      - name: Determine ref_type and ref_name
        uses: ./.github/actions/detect-ref

      - name: Extract info from CMakeLists.txt
        uses: ./.github/actions/extract-version
        with:
          dev-suffix-style: dash

      - name: Export package info
        id: package
        run: |
          {
            echo "file=OpenModScan-${APP_VERSION}-x86_64.AppImage"
            echo "artifact=OpenModScan-${APP_VERSION}-x86_64-AppImage"
            echo "desktop-file=omodscan${VERSION_MAJOR}.desktop"
          } >> "$GITHUB_OUTPUT"
          echo "APPIMAGE_FILE=OpenModScan-${APP_VERSION}-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git build-essential ninja-build patchelf rsync wget perl file \
            desktop-file-utils zsync fakeroot \
            libglu1-mesa libgl1-mesa-dev libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-xinerama0 libxcb-cursor0 libxcb-keysyms1 libxcb-xfixes0 \
            libxcb-shape0 libxcb-render-util0 libxcb-icccm4 libxcb-image0 \
            libfontconfig1 libfreetype6 libx11-6 libxext6 libxrender1 \
            zlib1g-dev libpng-dev libjpeg-dev libdbus-1-3 \
            libwayland-cursor0 libwayland-egl1-mesa \
            libgtk-3-0 libgdk-pixbuf2.0-0 libpangocairo-1.0-0 libpango-1.0-0 libatk1.0-0 libcairo2 libcairo-gobject2 \
            libcups2 \
            odbcinst libodbc1 \
            libpq5 libmysqlclient21

      - name: Install Python 3.12 from sources
        uses: ./.github/actions/install-python-from-source
        with:
          version: "3.12.2"

      - name: Install Qt
        id: qt
        uses: ./.github/actions/install-qt
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          install-dir: /opt/Qt
          qt-dir-name: gcc_64
          modules: qt5compat qtpdf qtserialport qtserialbus
          python-command: python3

      - name: Install CMake
        run: |
          apt-get remove -y cmake
          wget "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh"
          sh "cmake-${CMAKE_VERSION}-linux-x86_64.sh" --skip-license --prefix=/usr/local
          cmake --version

      - name: Set BUILD_DIR
        run: echo "BUILD_DIR=build-omodscan-Qt_${{ env.QT_VERSION }}-Release" >> $GITHUB_ENV

      - name: Configure project
        run: |
          cmake src -B ${{ env.BUILD_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_TESTING=OFF \
            -DPRERELEASE_SUFFIX=${{ env.PRERELEASE_SUFFIX }}

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Set APPDIR
        run: echo "APPDIR=build-appimage-Qt_${{ env.QT_VERSION }}/OpenModScan.AppDir" >> $GITHUB_ENV

      - name: Create AppDir
        run: mkdir -p "${{ env.APPDIR }}/usr"

      - name: Install cqtdeployer from sources
        uses: ./.github/actions/install-cqtdeployer
        with:
          qt-prefix-path: ${{ steps.qt.outputs.qt-root-dir }}

      - name: Resolve latest OpenSSL 3.5 LTS version
        uses: ./.github/actions/build-openssl3-runtime

      - name: Bundle Qt libraries and plugins throught cqtdeployer
        run: |
          CQtDeployer -bin ${{ env.BUILD_DIR }}/omodscan \
            -targetDir "${{ env.APPDIR }}/usr" \
            -libDir "$QT_ROOT_DIR/lib" \
            -ignore libcrypto.so.3,libmysqlclient.so.21,libpq.so.5,libssl.so.3,libqsqlmimer.so,libqsqlmysql.so,libqsqlodbc.so,libqsqlpsql.so,libqsqlibase.so,libqsqloci.so \
            -extraLibs icudata,icui18n,icuuc,libxcb-util,libxcb-cursor \
            -customScript 'export QT_QPA_PLATFORM=xcb'

      - name: Copy Linux app metadata sources
        run: cp -r .github/linux/usr/* "${{ env.APPDIR }}/usr"

      - name: Copy OpenSSL 3 libraries
        run: |
          cp /usr/local/lib64/libssl.so.3 \
             /usr/local/lib64/libcrypto.so.3 \
             "${{ env.APPDIR }}/usr/lib/"

      - name: Create Linux app metadata
        uses: ./.github/actions/linux-app-metadata
        with:
          root-dir: ${{ env.APPDIR }}
          app-install-prefix: /usr
          version-major: ${{ env.VERSION_MAJOR }}
          product-name: ${{ env.PRODUCT_NAME }}
          app-version: ${{ env.APP_VERSION }}
          ref-name: ${{ env.REF_NAME }}
          ref-type: ${{ env.REF_TYPE }}

      - name: Patch binary file
        run: patchelf --set-rpath '$ORIGIN/../lib' "${{ env.APPDIR }}/usr/bin/omodscan"

      - name: Populate AppDir root
        run: |
          ln -s omodscan "${{ env.APPDIR }}/usr/bin/omodscan${{ env.VERSION_MAJOR }}"
          install -m 0755 .github/linux/appimage/AppRun "${{ env.APPDIR }}/AppRun"
          cp "${{ env.APPDIR }}/usr/share/applications/omodscan${{ env.VERSION_MAJOR }}.desktop" \
             "${{ env.APPDIR }}/omodscan${{ env.VERSION_MAJOR }}.desktop"
          cp "${{ env.APPDIR }}/usr/share/icons/hicolor/128x128/apps/omodscan${{ env.VERSION_MAJOR }}.png" \
             "${{ env.APPDIR }}/omodscan${{ env.VERSION_MAJOR }}.png"
          cp "${{ env.APPDIR }}/omodscan${{ env.VERSION_MAJOR }}.png" "${{ env.APPDIR }}/.DirIcon"
          desktop-file-validate "${{ env.APPDIR }}/omodscan${{ env.VERSION_MAJOR }}.desktop"

      - name: Install appimagetool
        run: |
          wget -O /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        run: appimagetool "${{ env.APPDIR }}" "${{ env.APPIMAGE_FILE }}"

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: ${{ env.APPIMAGE_FILE }}

      - name: Create or update GitHub Release and upload AppImage
        uses: ./.github/actions/github-release
        with:
          prerelease: ${{ env.PRERELEASE_ENABLED }}
          app-version: ${{ env.APP_VERSION }}
          files: |
            ${{ env.APPIMAGE_FILE }}

  verify-omodscan:
    name: Verify AppImage
    runs-on: ubuntu-latest
    needs: build-omodscan
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}

      - name: Download AppImage
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-omodscan.outputs.artifact-name }}

      - name: Verify the AppImage runs
        uses: ./.github/actions/verify-appimage
        with:
          package: ${{ needs.build-omodscan.outputs.package-file }}
          desktop-file: ${{ needs.build-omodscan.outputs.desktop-file }}
          images: >-
            debian:12
            debian:13
            ubuntu:22.04
            ubuntu:24.04
            ubuntu:26.04
