name: Build Debian package (Ubuntu x64, Qt5)

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Checkout branch'
        required: false
        default: dev
      tag:
        description: 'Checkout tag'
        required: false

permissions:
  contents: write

jobs:
  build-omodscan:
    name: Build OpenModScan deb package version '${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}' with Qt5
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    env:
      QT_VERSION: "5.15.2"
      DEB_PACKAGE_PREFIX: "qt5-omodscan"
      APP_INSTALL_PREFIX: "/opt/OpenModScan"

    outputs:
      package-file: ${{ steps.package.outputs.file }}
      artifact-name: ${{ steps.package.outputs.artifact }}
      package-name: ${{ steps.package.outputs.package-name }}
      app-root: ${{ steps.package.outputs.app-root }}
      launcher: ${{ steps.package.outputs.launcher }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}

      - name: Determine ref_type and ref_name
        uses: ./.github/actions/detect-ref

      - name: Extract info from CMakeLists.txt
        uses: ./.github/actions/extract-version
        with:
          package-prefix: ${{ env.DEB_PACKAGE_PREFIX }}
          package-name-env: DEB_PACKAGE_NAME
          dev-suffix-style: tilde

      - name: Export package info
        id: package
        run: |
          {
            echo "file=${DEB_PACKAGE_NAME}_${APP_VERSION}-1_amd64.deb"
            echo "artifact=${DEB_PACKAGE_NAME}_${APP_VERSION}-1_amd64"
            echo "package-name=${DEB_PACKAGE_NAME}"
            echo "app-root=${APP_INSTALL_PREFIX}${VERSION_MAJOR}"
            echo "launcher=/usr/bin/omodscan${VERSION_MAJOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git build-essential ninja-build python3-pip patchelf rsync \
            dh-make debhelper debhelper-compat lintian fakeroot \
            libglu1-mesa libgl1-mesa-dev libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-xinerama0 libxcb-cursor0 libxcb-keysyms1 libxcb-xfixes0 \
            libxcb-shape0 libxcb-render-util0 libxcb-icccm4 libxcb-image0 \
            libfontconfig1 libfreetype6 libx11-6 libxext6 libxrender1 \
            zlib1g-dev libpng-dev libjpeg-dev libdbus-1-3 \
            libssl1.1 \
            libwayland-cursor0 libwayland-egl1-mesa \
            libgtk-3-0 libgdk-pixbuf2.0-0 libpangocairo-1.0-0 libpango-1.0-0 libatk1.0-0 libcairo2 libcairo-gobject2 \
            libcups2 \
            odbcinst libodbc1 \
            libpq5 libmysqlclient21

      - name: Upgrade pip
        run: python3 -m pip install --upgrade pip

      - name: Install Qt
        id: qt
        uses: ./.github/actions/install-qt
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: gcc_64
          install-dir: /opt/Qt
          qt-dir-name: gcc_64
          python-command: python3

      - name: Install CMake
        run: |
          apt-get remove -y cmake
          apt-get install -y wget
          wget "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh"
          sh "cmake-${CMAKE_VERSION}-linux-x86_64.sh" --skip-license --prefix=/usr/local
          cmake --version

      - name: Set BUILD_DIR
        run: echo "BUILD_DIR=build-omodscan-Qt_${{ env.QT_VERSION }}-Release" >> $GITHUB_ENV

      - name: Configure project
        run: |
          cmake src -B ${{ env.BUILD_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_TESTING=OFF \
            -DPRERELEASE_SUFFIX=${{ env.PRERELEASE_SUFFIX }}

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Set BUILD_DEB_DIR
        run: echo "BUILD_DEB_DIR=build-deb-package-Qt_${{ env.QT_VERSION }}" >> $GITHUB_ENV

      - name: Set DEB_SRC_DIR
        run: echo "DEB_SRC_DIR=${{ env.BUILD_DEB_DIR }}/${{ env.DEB_PACKAGE_NAME }}-${{ env.APP_VERSION }}-1_amd64" >> $GITHUB_ENV

      - name: Create DEB build directories
        run: |
          mkdir -p ${{ env.DEB_SRC_DIR }}/debian
          mkdir -p ${{ env.DEB_SRC_DIR }}/usr

      - name: Copy files to DEB_SRC_DIR
        run: |
          cp -r .github/linux/deb/* ${{ env.DEB_SRC_DIR }}/debian
          cp -r .github/linux/usr/* ${{ env.DEB_SRC_DIR }}/usr

      - name: Install cqtdeployer from sources
        uses: ./.github/actions/install-cqtdeployer
        with:
          qt-prefix-path: ${{ steps.qt.outputs.qt-root-dir }}
          apply-qt5-patch: "true"

      - name: Bundle Qt libraries and plugins throught cqtdeployer
        run: |
          CQtDeployer -bin ${{ env.BUILD_DIR }}/omodscan \
            -targetDir ${{ env.DEB_SRC_DIR }}${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }} \
            -libDir "$QT_ROOT_DIR/lib" \
            -ignore libcrypto.so.3,libmysqlclient.so.21,libpq.so.5,libssl.so.3,libqsqlmimer.so,libqsqlmysql.so,libqsqlodbc.so,libqsqlpsql.so \
            -extraLibs icudata,icui18n,icuuc,libxcb-util,libxcb-cursor

      - name: Copy OpenSSL 1 libraries
        run: |
          cp /usr/lib/x86_64-linux-gnu/libssl.so.1.1 \
             /usr/lib/x86_64-linux-gnu/libcrypto.so.1.1 \
             ${{ env.DEB_SRC_DIR }}${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }}/lib/

      - name: Create Debian control file
        run: |
          sed -e "s|@PACKAGE_NAME@|${{ env.DEB_PACKAGE_NAME }}|g" \
              -e "s|@PACKAGE_SOURCE@|${{ env.DEB_PACKAGE_NAME }}|g" \
              ${{ env.DEB_SRC_DIR }}/debian/control.in > ${{ env.DEB_SRC_DIR }}/debian/control
          rm ${{ env.DEB_SRC_DIR }}/debian/control.in
          cat -n ${{ env.DEB_SRC_DIR }}/debian/control

      - name: Create Debian changelog file
        run: |
          sed -e "s|@PACKAGE_NAME@|${{ env.DEB_PACKAGE_NAME }}|g" \
              -e "s|@APP_VERSION@|${{ env.APP_VERSION }}|g" \
              -e "s|@DEB_REVISION@|1|g" \
              -e "s|@RELEASE_DATE@|$(date -R)|g" \
              ${{ env.DEB_SRC_DIR }}/debian/changelog.in > ${{ env.DEB_SRC_DIR }}/debian/changelog
          rm ${{ env.DEB_SRC_DIR }}/debian/changelog.in
          cat -n ${{ env.DEB_SRC_DIR }}/debian/changelog

      - name: Create Debian copyrigth file
        run: |
          sed -e "s|@PACKAGE_NAME@|${{ env.DEB_PACKAGE_NAME }}|g" \
              -e "s|@RELEASE_YEAR@|$(date +%Y)|g" \
              ${{ env.DEB_SRC_DIR }}/debian/copyrigth.in > ${{ env.DEB_SRC_DIR }}/debian/copyrigth
          rm ${{ env.DEB_SRC_DIR }}/debian/copyrigth.in
          cat -n ${{ env.DEB_SRC_DIR }}/debian/copyrigth

      - name: Create Debian rules file
        run: |
          sed -e "s|@QT_LIB_PATH@|$QT_ROOT_DIR/lib|g" \
              -e "s|@APP_LIB_PATH@|${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }}/lib|g" \
              -e "s|@PACKAGE_NAME@|${{ env.DEB_PACKAGE_NAME }}|g" \
              ${{ env.DEB_SRC_DIR }}/debian/rules.in > ${{ env.DEB_SRC_DIR }}/debian/rules
          rm ${{ env.DEB_SRC_DIR }}/debian/rules.in
          cat -n ${{ env.DEB_SRC_DIR }}/debian/rules

      - name: Create Debian postinst file
        run: |
          sed -e "s|@APP_INSTALL_PREFIX@|${{ env.APP_INSTALL_PREFIX }}|g" \
              -e "s|@VERSION_MAJOR@|${{ env.VERSION_MAJOR }}|g" \
              ${{ env.DEB_SRC_DIR }}/debian/postinst.in > ${{ env.DEB_SRC_DIR }}/debian/postinst
          rm ${{ env.DEB_SRC_DIR }}/debian/postinst.in
          cat -n ${{ env.DEB_SRC_DIR }}/debian/postinst

      - name: Create Linux app metadata
        uses: ./.github/actions/linux-app-metadata
        with:
          root-dir: ${{ env.DEB_SRC_DIR }}
          app-install-prefix: ${{ env.APP_INSTALL_PREFIX }}
          version-major: ${{ env.VERSION_MAJOR }}
          product-name: ${{ env.PRODUCT_NAME }}
          app-version: ${{ env.APP_VERSION }}
          ref-name: ${{ env.REF_NAME }}
          ref-type: ${{ env.REF_TYPE }}

      - name: Patch binary file
        run: patchelf --set-rpath "${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }}/lib" "${{ env.DEB_SRC_DIR }}${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }}/bin/omodscan"

      - name: Build DEB package
        working-directory: ${{ env.DEB_SRC_DIR }}
        run: dpkg-buildpackage -us -uc -tc -b

      - name: Upload DEB package
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ env.DEB_PACKAGE_NAME }}_${{ env.APP_VERSION }}-1_amd64
          path: ${{ env.BUILD_DEB_DIR }}/${{ env.DEB_PACKAGE_NAME }}_${{ env.APP_VERSION }}-1_amd64.deb

      - name: Create or update GitHub Release and upload DEB
        uses: ./.github/actions/github-release
        with:
          prerelease: ${{ env.PRERELEASE_ENABLED }}
          app-version: ${{ env.APP_VERSION }}
          files: |
            ${{ env.BUILD_DEB_DIR }}/${{ env.DEB_PACKAGE_NAME }}_${{ env.APP_VERSION }}-1_amd64.deb

  verify-omodscan:
    name: Verify deb package installation
    runs-on: ubuntu-latest
    needs: build-omodscan
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}

      - name: Download DEB package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-omodscan.outputs.artifact-name }}

      - name: Verify the package installs
        uses: ./.github/actions/verify-linux-package
        with:
          package: ${{ needs.build-omodscan.outputs.package-file }}
          package-name: ${{ needs.build-omodscan.outputs.package-name }}
          app-root: ${{ needs.build-omodscan.outputs.app-root }}
          launcher: ${{ needs.build-omodscan.outputs.launcher }}
          package-manager: deb
          images: >-
            debian:12
            ubuntu:22.04
            ubuntu:24.04
            registry.astralinux.ru/astra/ubi17:latest
            registry.astralinux.ru/astra/ubi18:latest
