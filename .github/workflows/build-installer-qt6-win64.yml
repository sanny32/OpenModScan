name: Build OpenModScan Installer (Windows x64, Qt6)

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Checkout branch'
        required: false
        default: dev
      tag:
        description: 'Checkout tag'
        required: false
      signing:
        description: 'Sign executable and installer'
        type: boolean
        default: false

permissions:
  contents: write

env:
  QT_VERSION: 6.9.3
  EXE_PACKAGE_PREFIX: qt6-omodscan

  # SingPath variables
  PROJECT_SLUG: OpenModScan
  ORGANIZATION_ID: 6aeb3196-43e9-4b2c-83db-d1d90af47bc4
  ARTIFACT_CONF_SLUG: exe-zip

jobs:
  build-omodscan:
    name: Build OpenModScan installer version '${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}' with Qt6
    runs-on:  windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}

      - name: Extract version from CMakeLists.txt
        uses: ./.github/actions/extract-version
        with:
          package-prefix: ${{ env.EXE_PACKAGE_PREFIX }}
          package-name-env: EXE_PACKAGE_NAME
          dev-suffix-style: dash

      - name: Select signing policy
        run: |
          set SIGNING_POLICY_SLUG=none
          if "${{ env.ORGANIZATION_ID }}"=="" (
            echo WARNING: ORGANIZATION_ID is not set or empty, skipping signing steps.
          ) else (
            if "${{ github.event_name }}"=="push" (
              if "${{ github.ref_type }}"=="tag" (
                for /f %%i in ('echo "${{ github.ref_name }}" ^| find /i "test"') do set TAG_HAS_TEST=1
                if not defined TAG_HAS_TEST (
                  set SIGNING_POLICY_SLUG=release-signing
                )
              )
            )
            if "${{ github.event_name }}"=="workflow_dispatch" (
              if "${{ github.event.inputs.signing }}"=="true" (
                if not "${{ github.event.inputs.tag }}"=="" (
                  echo "${{ github.event.inputs.tag }}" | find /i "test" >nul
                  if errorlevel 1 (
                    set SIGNING_POLICY_SLUG=release-signing
                  )
                ) else (
                  set SIGNING_POLICY_SLUG=test-signing
                )
              )
            )
          )
          echo SIGNING_POLICY_SLUG=%SIGNING_POLICY_SLUG%>>%GITHUB_ENV%
          echo Selected signing policy: %SIGNING_POLICY_SLUG%
        shell: cmd

      - name: Install Python (for aqtinstall)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CMake
        run: |
          python -m pip install cmake==%CMAKE_VERSION%
          cmake --version
        shell: cmd

      - name: Install Qt
        uses: ./.github/actions/install-qt
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          arch: win64_msvc2022_64
          install-dir: C:/Qt
          qt-dir-name: msvc2022_64
          modules: qt5compat qtpdf qtserialport qtserialbus

      - name: Set BUILD_DIR
        run: |
          echo BUILD_DIR=build-omodscan-Qt_${{ env.QT_VERSION }}-Release>>%GITHUB_ENV%
        shell: cmd

      - name: Get Visual Studio path
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" ^
           -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          echo VS_PATH=%VS_PATH%>>%GITHUB_ENV%
        shell: cmd

      - name: Configure CMake
        run: |
          cmake src -B ${{ env.BUILD_DIR }} -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%" -DPRERELEASE_SUFFIX=${{ env.PRERELEASE_SUFFIX }} -DBUILD_TESTING=OFF
        shell: cmd

      - name: Build
        run: |
          cmake --build ${{ env.BUILD_DIR }} --config Release --parallel
        shell: cmd

      - name: Upload Executable
        id: upload-exe
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: omodscan-${{ env.APP_VERSION }}_x64.exe
          path: ${{ env.BUILD_DIR }}\Release\omodscan.exe

      - name: Signing Executable
        uses: signpath/github-action-submit-signing-request@v2
        if: success() && env.SIGNING_POLICY_SLUG != 'none'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ env.ORGANIZATION_ID }}'
          project-slug: '${{ env.PROJECT_SLUG }}'
          signing-policy-slug: ${{ env.SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.ARTIFACT_CONF_SLUG }}
          github-artifact-id: '${{steps.upload-exe.outputs.artifact-id}}'
          output-artifact-directory: ${{ env.BUILD_DIR }}\Release
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600

      - name: Upload signed Executable
        uses: actions/upload-artifact@v7
        if: success() && env.SIGNING_POLICY_SLUG != 'none'
        with:
          name: omodscan-${{ env.APP_VERSION }}_x64-signed.exe
          path: ${{ env.BUILD_DIR }}\Release\omodscan.exe

      - name: Deploy Qt dependencies using windeployqt
        run: |
          call "${{ env.VS_PATH }}\VC\Auxiliary\Build\vcvars64.bat"
          "%QT_ROOT_DIR%\bin\windeployqt.exe" ^
            "%CD%\${{ env.BUILD_DIR }}\Release\omodscan.exe" ^
            --release ^
            --no-opengl-sw ^
            --no-system-d3d-compiler ^
            --no-system-dxc-compiler ^
            --plugindir "%CD%\${{ env.BUILD_DIR }}\Release\plugins" ^
            --skip-plugin-types help,generic,networkinformation,qmltooling ^
            --exclude-plugins qgif,qjpeg,qpdf,qsqlibase,qsqlmimer,qsqloci,qsqlodbc,qsqlpsql
        shell: cmd

      - name: Remove qml folder
        run: |
          IF EXIST "%CD%\${{ env.BUILD_DIR }}\Release\qml" (
            dir /a /b "%CD%\${{ env.BUILD_DIR }}\Release\qml" | findstr . >nul
            IF ERRORLEVEL 1 (
              rmdir "%CD%\${{ env.BUILD_DIR }}\Release\qml"
            ) ELSE (
              echo "qml folder is not empty - keeping it"
            )
          ) ELSE (
            echo "No qml folder found — nothing to remove"
          )
          exit /b 0
        shell: cmd

      - name: Install NSIS
        run: |
          choco install nsis -y
        shell: cmd

      - name: Build NSIS installer
        run: |
          "C:\Program Files (x86)\NSIS\makensis.exe" ^
           /DVERSION="${{ env.APP_VERSION }}" ^
           /DVERSION_NUMERIC="${{ env.BASE_VERSION }}" ^
           /DMIN_WINDOWS_VERSION=10 ^
           /DBUILD_PATH="%CD%\${{ env.BUILD_DIR }}\Release" ^
           /DICON_FILE="%CD%\src\res\omodscan.ico" ^
           /DWELCOMEFINISHPAGE_BITMAP="%CD%\.github\win32\nsis3-omodscan.bmp" ^
           /DLICENSE_FILE="%CD%\src\res\license.txt" ^
           /DOUTPUT_FILE="%CD%\${{ env.EXE_PACKAGE_NAME }}-${{ env.APP_VERSION }}_x64.exe" ^
           %CD%\.github\win32\installer-win64.nsi
        shell: cmd

      - name: Upload Installer
        id: upload-installer
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ env.EXE_PACKAGE_NAME }}-${{ env.APP_VERSION }}_x64
          path: ${{ env.EXE_PACKAGE_NAME }}-${{ env.APP_VERSION }}_x64.exe

      - name: Signing Installer
        uses: signpath/github-action-submit-signing-request@v2
        if: success() && env.SIGNING_POLICY_SLUG != 'none'
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ env.ORGANIZATION_ID }}'
          project-slug: '${{ env.PROJECT_SLUG }}'
          signing-policy-slug: ${{ env.SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.ARTIFACT_CONF_SLUG }}
          github-artifact-id: '${{steps.upload-installer.outputs.artifact-id}}'
          output-artifact-directory: .
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600

      - name: Upload signed Installer
        uses: actions/upload-artifact@v7
        if: success() && env.SIGNING_POLICY_SLUG != 'none'
        with:
          name: ${{ env.EXE_PACKAGE_NAME }}-${{ env.APP_VERSION }}_x64-signed
          path: ${{ env.EXE_PACKAGE_NAME }}-${{ env.APP_VERSION }}_x64.exe

      - name: Create or update GitHub Release and upload EXE
        uses: ./.github/actions/github-release
        with:
          prerelease: ${{ env.PRERELEASE_ENABLED }}
          app-version: ${{ env.APP_VERSION }}
          files: |
            ${{ env.EXE_PACKAGE_NAME }}-${{ env.APP_VERSION }}_x64.exe
