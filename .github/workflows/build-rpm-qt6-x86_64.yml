name: Build RPM package (Ubuntu x64, Qt6)

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Checkout branch'
        required: false
        default: dev
      tag:
        description: 'Checkout tag'
        required: false

permissions:
  contents: write

jobs:
  build-omodscan:
    name: Build OpenModScan rpm package version '${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}' with Qt6
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    env:
      QT_VERSION: "6.9.3"
      RPM_PACKAGE_PREFIX: "qt6-omodscan"
      APP_INSTALL_PREFIX: "/opt/OpenModScan"

    outputs:
      package-file: ${{ steps.package.outputs.file }}
      artifact-name: ${{ steps.package.outputs.artifact }}
      package-name: ${{ steps.package.outputs.package-name }}
      app-root: ${{ steps.package.outputs.app-root }}
      launcher: ${{ steps.package.outputs.launcher }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}

      - name: Determine ref_type and ref_name
        uses: ./.github/actions/detect-ref

      - name: Extract info from CMakeLists.txt
        uses: ./.github/actions/extract-version
        with:
          package-prefix: ${{ env.RPM_PACKAGE_PREFIX }}
          package-name-env: RPM_PACKAGE_NAME
          dev-suffix-style: tilde

      - name: Export package info
        id: package
        run: |
          {
            echo "file=${RPM_PACKAGE_NAME}-${APP_VERSION}-1.x86_64.rpm"
            echo "artifact=${RPM_PACKAGE_NAME}-${APP_VERSION}-1.x86_64"
            echo "package-name=${RPM_PACKAGE_NAME}"
            echo "app-root=${APP_INSTALL_PREFIX}${VERSION_MAJOR}"
            echo "launcher=/usr/bin/omodscan${VERSION_MAJOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git build-essential ninja-build patchelf rsync wget \
            rpm gnupg2 \
            libglu1-mesa libgl1-mesa-dev libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-xinerama0 libxcb-cursor0 libxcb-keysyms1 libxcb-xfixes0 \
            libxcb-shape0 libxcb-render-util0 libxcb-icccm4 libxcb-image0 \
            libfontconfig1 libfreetype6 libx11-6 libxext6 libxrender1 \
            zlib1g-dev libpng-dev libjpeg-dev libdbus-1-3 \
            libwayland-cursor0 libwayland-egl1-mesa \
            libgtk-3-0 libgdk-pixbuf2.0-0 libpangocairo-1.0-0 libpango-1.0-0 libatk1.0-0 libcairo2 libcairo-gobject2 \
            libcups2 \
            odbcinst libodbc1 \
            libpq5 libmysqlclient21

      - name: Install Python 3.12 from sources
        uses: ./.github/actions/install-python-from-source
        with:
          version: "3.12.2"

      - name: Install Qt
        id: qt
        uses: ./.github/actions/install-qt
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          arch: linux_gcc_64
          install-dir: /opt/Qt
          qt-dir-name: gcc_64
          modules: qt5compat qtpdf qtserialport qtserialbus
          python-command: python3

      - name: Install CMake
        run: |
          apt-get remove -y cmake
          wget "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.sh"
          sh "cmake-${CMAKE_VERSION}-linux-x86_64.sh" --skip-license --prefix=/usr/local
          cmake --version

      - name: Set BUILD_DIR
        run: echo "BUILD_DIR=build-omodscan-Qt_${{ env.QT_VERSION }}-Release" >> $GITHUB_ENV

      - name: Configure project
        run: |
          cmake src -B ${{ env.BUILD_DIR }} \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DBUILD_TESTING=OFF \
            -DPRERELEASE_SUFFIX=${{ env.PRERELEASE_SUFFIX }}

      - name: Build
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      - name: Set BUILD_RPM_DIR
        run: echo "BUILD_RPM_DIR=build-rpm-package-Qt_${{ env.QT_VERSION }}" >> $GITHUB_ENV

      - name: Create RPM build directories
        run: |
          mkdir -p ${{ env.BUILD_RPM_DIR }}/BUILD
          mkdir -p ${{ env.BUILD_RPM_DIR }}/RPMS
          mkdir -p ${{ env.BUILD_RPM_DIR }}/SOURCES/omodscan
          mkdir -p ${{ env.BUILD_RPM_DIR }}/SPECS
          mkdir -p ${{ env.BUILD_RPM_DIR }}/SRPMS

      - name: Copy files to BUILD_RPM_DIR
        run: |
          rsync -a .github/linux/rpm/* ${{ env.BUILD_RPM_DIR }}/SPECS
          rsync -a .github/linux/usr/* ${{ env.BUILD_RPM_DIR }}/SOURCES/omodscan/usr

      - name: Install cqtdeployer from sources
        uses: ./.github/actions/install-cqtdeployer
        with:
          qt-prefix-path: ${{ steps.qt.outputs.qt-root-dir }}

      - name: Resolve latest OpenSSL 3.5 LTS version
        uses: ./.github/actions/build-openssl3-runtime

      - name: Bundle Qt libraries and plugins throught cqtdeployer
        run: |
          CQtDeployer -bin ${{ env.BUILD_DIR }}/omodscan \
            -targetDir ${{ env.BUILD_RPM_DIR }}/SOURCES/omodscan${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }} \
            -libDir "$QT_ROOT_DIR/lib" \
            -ignore libcrypto.so.3,libmysqlclient.so.21,libpq.so.5,libssl.so.3,libqsqlmimer.so,libqsqlmysql.so,libqsqlodbc.so,libqsqlpsql.so,libqsqlibase.so,libqsqloci.so \
            -extraLibs icudata,icui18n,icuuc,libxcb-util,libxcb-cursor \
            -customScript 'export QT_QPA_PLATFORM=xcb'

      - name: Copy OpenSSL 3 libraries
        run: |
          cp /usr/local/lib64/libssl.so.3 \
             /usr/local/lib64/libcrypto.so.3 \
             "${{ env.BUILD_RPM_DIR }}/SOURCES/omodscan${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }}/lib/"

      - name: Create RPM spec file
        run: |
          sed -e "s|@PACKAGE_NAME@|${{ env.RPM_PACKAGE_NAME }}|g" \
              -e "s|@APP_VERSION@|${{ env.APP_VERSION }}|g" \
              -e "s|@APP_INSTALL_PREFIX@|${{ env.APP_INSTALL_PREFIX }}|g" \
              -e "s|@VERSION_MAJOR@|${{ env.VERSION_MAJOR }}|g" \
              ${{ env.BUILD_RPM_DIR }}/SPECS/omodscan.spec.in > ${{ env.BUILD_RPM_DIR }}/SPECS/omodscan.spec
          rm ${{ env.BUILD_RPM_DIR }}/SPECS/omodscan.spec.in
          cat -n ${{ env.BUILD_RPM_DIR }}/SPECS/omodscan.spec

      - name: Create Linux app metadata
        uses: ./.github/actions/linux-app-metadata
        with:
          root-dir: ${{ env.BUILD_RPM_DIR }}/SOURCES/omodscan
          app-install-prefix: ${{ env.APP_INSTALL_PREFIX }}
          version-major: ${{ env.VERSION_MAJOR }}
          product-name: ${{ env.PRODUCT_NAME }}
          app-version: ${{ env.APP_VERSION }}
          ref-name: ${{ env.REF_NAME }}
          ref-type: ${{ env.REF_TYPE }}

      - name: Patch binary file
        run: patchelf --set-rpath "${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }}/lib" "${{ env.BUILD_RPM_DIR }}/SOURCES/omodscan${{ env.APP_INSTALL_PREFIX }}${{ env.VERSION_MAJOR }}/bin/omodscan"

      - name: Import GPG keys
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build RPM package
        working-directory: ${{ env.BUILD_RPM_DIR }}
        run: rpmbuild --define "_topdir `pwd`" -v -ba SPECS/omodscan.spec

      - name: Sign RPM package
        working-directory: ${{ env.BUILD_RPM_DIR }}
        run: |
          RPM_FILE="${{ env.RPM_PACKAGE_NAME }}-${{ env.APP_VERSION }}-1.x86_64.rpm"
          SAFE_RPM_FILE=$(echo "$RPM_FILE" | sed 's/~/−/g')

          if [ "$RPM_FILE" != "$SAFE_RPM_FILE" ]; then
            mv "RPMS/x86_64/$RPM_FILE" "RPMS/x86_64/$SAFE_RPM_FILE"
          fi
          rpmsign --addsign --define "_gpg_name 841A6E73CED20603737BDCBA457ECBB2757E57F1" "RPMS/x86_64/$SAFE_RPM_FILE"

          if [ "$RPM_FILE" != "$SAFE_RPM_FILE" ]; then
            mv "RPMS/x86_64/$SAFE_RPM_FILE" "RPMS/x86_64/$RPM_FILE"
          fi

      - name: Upload RPM package
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: ${{ env.RPM_PACKAGE_NAME }}-${{ env.APP_VERSION }}-1.x86_64
          path: ${{ env.BUILD_RPM_DIR }}/RPMS/x86_64/${{ env.RPM_PACKAGE_NAME }}-${{ env.APP_VERSION }}-1.x86_64.rpm

      - name: Save public GPG key to file
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: |
          echo "$GPG_PUBLIC_KEY" > ${{ env.RPM_PACKAGE_NAME }}.rpm.pubkey

      - name: Upload public GPG key
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RPM_PACKAGE_NAME }}.rpm.pubkey
          path: ${{ env.RPM_PACKAGE_NAME }}.rpm.pubkey

      - name: Create or update GitHub Release and upload RPM
        uses: ./.github/actions/github-release
        with:
          prerelease: ${{ env.PRERELEASE_ENABLED }}
          app-version: ${{ env.APP_VERSION }}
          files: |
            ${{ env.BUILD_RPM_DIR }}/RPMS/x86_64/${{ env.RPM_PACKAGE_NAME }}-${{ env.APP_VERSION }}-1.x86_64.rpm
            ${{ env.RPM_PACKAGE_NAME }}.rpm.pubkey

  verify-omodscan:
    name: Verify rpm package installation
    runs-on: ubuntu-latest
    needs: build-omodscan
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.event.inputs.branch || github.ref_name }}

      - name: Download RPM package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-omodscan.outputs.artifact-name }}

      - name: Trust RED SOFT registry
        uses: ./.github/actions/trust-redsoft-registry

      - name: Verify the package installs
        uses: ./.github/actions/verify-linux-package
        with:
          package: ${{ needs.build-omodscan.outputs.package-file }}
          package-name: ${{ needs.build-omodscan.outputs.package-name }}
          app-root: ${{ needs.build-omodscan.outputs.app-root }}
          launcher: ${{ needs.build-omodscan.outputs.launcher }}
          package-manager: rpm
          images: >-
            fedora:43
            fedora:44
            rockylinux/rockylinux:10.1
            registry.red-soft.ru/redos8c/ubi:latest
            opensuse/leap:15.6
            alt:p11
