name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        qt: [5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Check package version handling
        run: python3 -m unittest discover -s tests/ci -v
      - name: Install Qt 5
        if: matrix.qt == 5
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build socat qtbase5-dev qttools5-dev qttools5-dev-tools libqt5serialbus5-dev libqt5serialport5-dev
      - name: Install Qt 6
        if: matrix.qt == 6
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build socat qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-serialbus-dev qt6-serialport-dev qt6-5compat-dev
      - name: Configure
        run: cmake -S src -B build-tests -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DUSE_QT${{ matrix.qt }}=ON
      - name: Build tests
        run: cmake --build build-tests --target check-build --parallel 2
      - name: Run tests
        env:
          OMODSCAN_TEST_SERIAL_CLIENT: /tmp/omodscan-client
          OMODSCAN_TEST_SERIAL_PEER: /tmp/omodscan-peer
        run: |
          socat pty,raw,echo=0,link="$OMODSCAN_TEST_SERIAL_CLIENT" pty,raw,echo=0,link="$OMODSCAN_TEST_SERIAL_PEER" &
          serial_pair_pid=$!
          trap 'kill "$serial_pair_pid"' EXIT
          for attempt in {1..50}; do
            if [ -e "$OMODSCAN_TEST_SERIAL_CLIENT" ] && [ -e "$OMODSCAN_TEST_SERIAL_PEER" ]; then
              break
            fi
            sleep 0.1
          done
          test -e "$OMODSCAN_TEST_SERIAL_CLIENT"
          test -e "$OMODSCAN_TEST_SERIAL_PEER"
          ctest --test-dir build-tests --output-on-failure --no-tests=error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-qt${{ matrix.qt }}
          path: build-tests/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
