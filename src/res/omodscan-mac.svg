<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#353a47"/>
      <stop offset="100%" stop-color="#1c2028"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#10f540"/>
      <stop offset="100%" stop-color="#00c42a"/>
    </linearGradient>

    <linearGradient id="grayGradTR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f3f4f7"/>
      <stop offset="100%" stop-color="#d5d6de"/>
    </linearGradient>

    <linearGradient id="grayGradBL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="15%"  stop-color="#f5f5f9"/>
      <stop offset="100%" stop-color="#d9dbe3"/>
    </linearGradient>

    <linearGradient id="darkGreenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#008b00"/>
      <stop offset="12%"  stop-color="#008000"/>
      <stop offset="100%" stop-color="#006800"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="204" ry="204"
        fill="url(#bgGrad)"/>

  <rect x="148" y="258" width="326" height="207" rx="33" ry="33"
        fill="url(#greenGrad)"/>

  <rect x="552" y="258" width="326" height="207" rx="33" ry="33"
        fill="url(#grayGradTR)"/>

  <rect x="148" y="539" width="326" height="212" rx="33" ry="33"
        fill="url(#grayGradBL)"/>

  <rect x="552" y="539" width="326" height="212" rx="33" ry="33"
        fill="url(#darkGreenGrad)"/>
</svg>
